[package]
name = "vpc-tun"
version = "0.1.0"
edition = "2024"
description = "Carry IPv6 packets between a laptop tun and a Datum VPC over iroh"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
iroh = "1.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2.8", features = ["async"] }
