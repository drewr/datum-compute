# The Kubernetes control plane: one unikernel instance running etcd,
# kube-apiserver, kube-controller-manager, kube-scheduler and a tainted
# kubelet (image/node.sh, ROLE=cp). deploy.sh fills in @IMAGE@ and
# @PULL_SECRET@.
#
# reclaimPolicy Retain keeps the instance's address across redeploys, since the
# workers find the API server by it.
apiVersion: compute.datumapis.com/v1alpha
kind: Workload
metadata:
  annotations:
    k8s-demo/manifest: "@MANIFEST_SUM@"   # set by deploy.sh
  name: k8s-cp
  namespace: default
spec:
  placements:
  - name: default
    locations:
    - name: us-central-1
    scaleSettings:
      minReplicas: 1
  template:
    spec:
      networkInterfaces:
      - name: eth0
        ipFamilies: [IPv6]
        network:
          name: default
        reclaimPolicy: Retain
      runtime:
        class: unikernel
        resources:
          instanceType: datumcloud-d1-standard-2
        sandbox:
          imagePullSecrets:
          - name: @PULL_SECRET@
          containers:
          - name: node
            image: @IMAGE@
            env:
            - name: ROLE
              value: cp
            ports:
            - name: apiserver
              port: 6443
              protocol: TCP
            volumeAttachments:
            - name: ca
              mountPath: /secrets/k8s-ca
            - name: join
              mountPath: /secrets/k8s-join
            - name: addons
              mountPath: /etc/k8s/addons
      volumes:
      - name: ca
        secret:
          secretName: k8s-ca
      - name: join
        secret:
          secretName: k8s-join
      - name: addons
        configMap:
          name: k8s-addons
