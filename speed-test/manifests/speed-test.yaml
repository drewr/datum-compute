# Speed test (TypeScript on Node.js) on the unikernel class in the
# datum-cloud project, published at a Datum-managed HTTPS URL and at
# https://speed.datum.net. LOCATION names the placement's location for the
# page's map and server details; keep the two in step.
#
# Built like todo-app (see ../../todo-app/manifests/todo-app.yaml for why each
# step is the way it is):
#
#   nix-build -A app -o result
#   skopeo copy --digestfile digest docker-archive:result docker://ghcr.io/drewr/speed-test:<tag>
#   echo "FROM ghcr.io/drewr/speed-test@$(cat digest)" > uk/Dockerfile
#   datumctl compute build uk --analyze --push --output ghcr.io/drewr/speed-test-uk:<tag>
#
# Both ghcr packages must be public: a flag deploy drops imagePullSecrets
# (https://github.com/datum-cloud/compute/issues/432). Refer to the unikernel
# image by digest only. The first deploy gives the workload its URL:
#
#   datumctl compute deploy speed-test --project=datum-cloud --image=<speed-test-uk@digest> \
#     --location=us-central-1 --runtime-class=unikernel --http-port=8080 --env=LOCATION=us-central-1
#   datumctl dns record set datum.net speed CNAME <new>.datumproxy.net. --project=datum-cloud
#   datumctl alb hostname add speed-test speed.datum.net --project=datum-cloud
#
# Later image changes: put the new digest below and run
# datumctl compute deploy -f manifests/speed-test.yaml --project=datum-cloud
# (keeps the URL).
apiVersion: compute.datumapis.com/v1alpha
kind: Workload
metadata:
  name: speed-test
  namespace: default
spec:
  placements:
  - name: default
    locations:
    - name: us-central-1
    scaleSettings:
      instanceManagementPolicy: OrderedReady
      minReplicas: 1
  template:
    metadata: {}
    spec:
      networkInterfaces:
      - name: eth0
        ipFamilies:
        - IPv6
        network:
          name: default
        reclaimPolicy: Delete
      runtime:
        class: unikernel
        resources:
          instanceType: datumcloud/d1-standard-2
        sandbox:
          containers:
          - name: app
            image: ghcr.io/drewr/speed-test-uk@sha256:eab05d856a57cbf5d68a34f7cf1c71f0cce8789c87f3b881a50f85522688ae77
            ports:
            - name: http
              port: 8080
              protocol: TCP
            env:
            - name: LOCATION
              value: us-central-1
